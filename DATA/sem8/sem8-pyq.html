<!DOCTYPE html>
<html lang="en">

<head>

    <title>dumbAF - SEM 8 PYQs</title>
    <link rel="icon" type="image/x-icon" href="../../assets/logo.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: #f4f4f4;
            color: #000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #fff;
            padding: 20px;
            border-bottom: 3px solid #000;
            text-align: center;
        }

        h1 {
            font-size: 2em;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        h1 a {
            color: #fff;
            text-decoration: none;
            background-color: #00475a;
            padding: 0 5px;
        }

        .breadcrumb {
            padding: 10px 20px;
            background-color: #e0e0e0;
            border-bottom: 2px solid #000;
            font-size: 0.9em;
        }

        .breadcrumb a {
            color: #0000ee;
        }

        main {
            flex: 1;
            padding: 40px 20px;
            max-width: 1000px;
            margin: 0 auto;
            width: 100%;
        }

        .notice-card {
            background: #fff;
            border: 3px solid #00475a;
            padding: 40px;
            margin: 40px 0;
            box-shadow: 8px 8px 0px #000;
            text-align: center;
        }

        .notice-icon {
            font-size: 5em;
            margin-bottom: 20px;
        }

        .notice-title {
            font-size: 2em;
            color: #00475a;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .notice-text {
            font-size: 1.2em;
            line-height: 1.8;
            margin-bottom: 15px;
        }

        .congrats {
            margin-top: 30px;
            padding: 25px;
            background-color: #e8f5e9;
            border: 2px solid #00475a;
            font-size: 1.3em;
            font-weight: bold;
        }

        footer {
            background-color: #000;
            color: #fff;
            padding: 20px;
            text-align: center;
            margin-top: auto;
            border-top: 5px solid #00475a;
        }

        footer p {
            font-style: italic;
        }
    </style>
</head>

<body>
    <header>
        <h1><a href="../../index.html">dumbAF</a> / SEM 8 PYQs</h1>
    </header>

    <nav class="breadcrumb">
        <a href="../../index.html">Home</a> &gt;
        <span>SEM 8</span> &gt;
        <span>PYQs</span>
    </nav>

    <main>
        <div class="notice-card">
            <div class="notice-icon">🎓</div>
            <div class="notice-title">Final Semester!</div>
            <p class="notice-text">
                You've made it to the final stretch! 
            </p>
            <p class="notice-text">
                Semester 8 is all about projects, placements, and wrapping up your journey.
            </p>
            <div class="congrats">
                No more exams to worry about!<br>
                Focus on your project and securing that dream job! 💼
            </div>
        </div>

    <footer>
        <p>"The end is just the beginning..." &#127891;</p>
