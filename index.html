<body>

    <footer>
        <div class="footer-left">

        </div>

    <script>
        function toggleSemesters(course) {
            var semesterContainer = document.getElementById("semesters");
            if (
                semesterContainer.style.display === "none" ||
                semesterContainer.style.display === ""
            ) {
                semesterContainer.style.display = "block";
            } else {
                semesterContainer.style.display = "none";
            }
        }

        // Improved visitor counter without static numbers
        document.addEventListener('DOMContentLoaded', function() {
            const visitCountElement = document.getElementById('visit-count');
            
            // Try counter APIs in sequence
            tryMainCounter()
                .catch(() => tryBackupCounter())
                .catch(() => {
                    visitCountElement.textContent = '?';
                });
            
            // First attempt: Main CountAPI endpoint
            function tryMainCounter() {
                // Using exact website URL for the namespace
                return fetch('https://api.countapi.xyz/hit/collabdoor.github.io-dumbaf/visits')
                    .then(response => {
                        if (!response.ok) throw new Error('Main counter failed');
                        return response.json();
                    })
                    .then(data => {
                        if (data && typeof data.value === 'number') {
                            visitCountElement.textContent = data.value.toLocaleString();
                            return data;
                        }
                        throw new Error('Invalid data from main counter');
                    });
            }
            
            // Second attempt: Alternative endpoint with namespace
            function tryBackupCounter() {
                // Using alternative namespace format but still based on the actual site URL
                const ns = 'dumbaf.collabdoor.github.io';
                return fetch(`https://api.countapi.xyz/hit/${ns}/visits`)
                    .then(response => {
                        if (!response.ok) throw new Error('Backup counter failed');
                        return response.json();
                    })
                    .then(data => {
                        if (data && typeof data.value === 'number') {
                            visitCountElement.textContent = data.value.toLocaleString();
                            return data;
                        }
                        throw new Error('Invalid data from backup counter');
                    });
            }
        });
    </script>
</body>
